name: release-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Node 22.23.0
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run release:check
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: release/inductio-0.1.0.tgz
          if-no-files-found: error
          retention-days: 14

  compare-packages:
    name: compare Windows and Linux tarballs
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package-windows-latest
          path: artifacts/windows
      - uses: actions/download-artifact@v4
        with:
          name: package-ubuntu-latest
          path: artifacts/linux
      - run: |
          sha256sum artifacts/windows/inductio-0.1.0.tgz
          sha256sum artifacts/linux/inductio-0.1.0.tgz
          cmp artifacts/windows/inductio-0.1.0.tgz artifacts/linux/inductio-0.1.0.tgz
          echo "CROSS_OS_TARBALL_BYTE_IDENTITY=PASS"
